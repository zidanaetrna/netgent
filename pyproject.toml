[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netgent"
version = "1.0.0"
description = "Autonomous AI Network Engineering Agent for Cisco Packet Tracer (because dragging cables manually is medieval pain)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "zidanaetrna", email = "zidanaetrna@users.noreply.github.com" },
]
keywords = [
    "cisco-packet-tracer",
    "network-automation",
    "ai-agent",
    "topology-synthesis",
    "claude-code",
    "antigravity",
    "ccna",
    "networking",
    "lazy-dev-superpowers"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator"
]
dependencies = [
    "pyautogui>=0.9.54",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pygetwindow>=0.0.9",
    "numpy>=1.26.0",
    "python-socketio>=5.10.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[project.scripts]
netgent = "src.main:main"
netgent-cli = "src.ui.agent_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "extensions*"]

[tool.pyright]
include = ["."]
extraPaths = ["."]

