      - "no shutdown"
      - "end"
      - "write memory"

  SW-GEDUNG-B:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname SW-GEDUNG-B"
      - "spanning-tree mode rapid-pvst"
      - "vlan 20"
      - "name DOSEN-STAFF"
      - "exit"
      - "vlan 99"
      - "name NATIVE-BLACKHOLE"
      - "exit"
      - "interface GigabitEthernet0/1"
      - "switchport mode trunk"
      - "switchport trunk native vlan 99"
      - "no shutdown"
      - "exit"
      - "interface FastEthernet0/1"
      - "switchport mode access"
