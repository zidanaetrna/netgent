  PC-LAB-C1:
    type: "pc"
    ip_address: "10.10.30.20"
    subnet_mask: "255.255.252.0"
    default_gateway: "10.10.30.1"

verifications:
  - source: "PC-LAB-A1"
    target_ip: "10.10.50.10"
    ping_count: 4

  - source: "PC-DOSEN-B"
    target_ip: "10.10.50.20"
    ping_count: 4

  - source: "PC-LAB-C1"
    target_ip: "10.10.50.30"
    ping_count: 4

  - source: "SRV-AKADEMIK"
    target_ip: "10.10.1.1"
    ping_count: 4
