name: "Small Office Star LAN"
description: "Central Switch 2960 with Router 2911 default gateway and two workstations."

devices:
  - id: "R1"
    type: "router_2911"
    position:
      x: 0.50
      y: 0.25

  - id: "SW1"
    type: "switch_2960"
    position:
      x: 0.50
      y: 0.50

  - id: "PC1"
    type: "pc"
    position:
      x: 0.30
      y: 0.75

  - id: "PC2"
    type: "pc"
    position:
      x: 0.70
      y: 0.75

connections:
  - from: "R1"
    to: "SW1"
    cable_type: "copper_straight_through"
    from_port: 0
    to_port: 0

  - from: "SW1"
    to: "PC1"
    cable_type: "copper_straight_through"
    from_port: 1
    to_port: 0

  - from: "SW1"
    to: "PC2"
    cable_type: "copper_straight_through"
    from_port: 2
    to_port: 0

configurations:
  R1:
    type: "ios"
    commands:
      - "no"
      - "enable"
      - "configure terminal"
      - "hostname R1"
      - "interface GigabitEthernet0/0"
      - "ip address 192.168.1.1 255.255.255.0"
      - "no shutdown"
      - "end"
      - "write memory"

  SW1:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname SW1"
      - "end"

  PC1:
    type: "pc"
    ip_address: "192.168.1.10"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.1.1"

  PC2:
    type: "pc"
    ip_address: "192.168.1.11"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.1.1"

verifications:
  - source: "PC1"
    target_ip: "192.168.1.1"
    ping_count: 4

  - source: "PC1"
    target_ip: "192.168.1.11"
    ping_count: 4
