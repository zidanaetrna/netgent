name: "Praktikum 2 - LAN Menggunakan Switch"
description: "Membangun LAN bintang sederhana menghubungkan 3 PC (PC1, PC2, PC3) ke Switch 2960 dalam satu subnet 192.168.1.0/24."

devices:
  - id: "SW1"
    type: "switch_2960"
    position:
      x: 0.50
      y: 0.35

  - id: "PC1"
    type: "pc"
    position:
      x: 0.25
      y: 0.70

  - id: "PC2"
    type: "pc"
    position:
      x: 0.50
      y: 0.70

  - id: "PC3"
    type: "pc"
    position:
      x: 0.75
      y: 0.70

connections:
  - from: "SW1"
    to: "PC1"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/1"
    to_port: "FastEthernet0"

  - from: "SW1"
    to: "PC2"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/2"
    to_port: "FastEthernet0"

  - from: "SW1"
    to: "PC3"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/3"
    to_port: "FastEthernet0"

configurations:
  SW1:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname Switch-Lab"
      - "end"

  PC1:
    type: "pc"
    ip_address: "192.168.1.10"
    subnet_mask: "255.255.255.0"

  PC2:
    type: "pc"
    ip_address: "192.168.1.20"
    subnet_mask: "255.255.255.0"

  PC3:
    type: "pc"
    ip_address: "192.168.1.30"
    subnet_mask: "255.255.255.0"

verifications:
  - source: "PC1"
    target_ip: "192.168.1.20"
    ping_count: 4

  - source: "PC1"
    target_ip: "192.168.1.30"
    ping_count: 4

  - source: "PC2"
    target_ip: "192.168.1.30"
    ping_count: 4
