name: "Topologi Partial Mesh 10 Router - Enterprise Backbone"
description: "Arsitektur WAN Enterprise 10 Router berkonfigurasi Partial Mesh (14 point-to-point links) dengan routing dinamis OSPF Area 0, link redundancy multi-path, dan proteksi kegagalan link tanpa Single Point of Failure (SPOF)."

devices:
  # 10 Router Backbone (Cisco 2911)
  - id: "R01"
    type: "router_2911"
    position:
      x: 0.20
      y: 0.20

  - id: "R02"
    type: "router_2911"
    position:
      x: 0.50
      y: 0.15

  - id: "R03"
    type: "router_2911"
    position:
      x: 0.80
      y: 0.20

  - id: "R04"
    type: "router_2911"
    position:
      x: 0.90
      y: 0.45

  - id: "R05"
    type: "router_2911"
    position:
      x: 0.80
      y: 0.70

  - id: "R06"
    type: "router_2911"
    position:
      x: 0.50
      y: 0.75

  - id: "R07"
    type: "router_2911"
    position:
      x: 0.20
      y: 0.70

  - id: "R08"
    type: "router_2911"
    position:
      x: 0.10
      y: 0.45

  - id: "R09"
    type: "router_2911"
    position:
      x: 0.35
      y: 0.45

  - id: "R10"
    type: "router_2911"
    position:
      x: 0.65
      y: 0.45

  # End Devices untuk Verifikasi Konektivitas Ujung-ke-Ujung
  - id: "PC-HQ"
    type: "pc"
    position:
      x: 0.08
      y: 0.12

  - id: "PC-CABANG"
    type: "pc"
    position:
      x: 0.65
      y: 0.30

connections:
  # Client connections
  - from: "PC-HQ"
    to: "R01"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "GigabitEthernet0/0"

  - from: "PC-CABANG"
    to: "R10"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "GigabitEthernet0/0"

  # Outer Ring Connections (8 links)
  # R01 <-> R02
  - from: "R01"
    to: "R02"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  # R02 <-> R03
  - from: "R02"
    to: "R03"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  # R03 <-> R04
  - from: "R03"
    to: "R04"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  # R04 <-> R05
  - from: "R04"
    to: "R05"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  # R05 <-> R06
  - from: "R05"
    to: "R06"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  # R06 <-> R07
  - from: "R06"
    to: "R07"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  # R07 <-> R08
  - from: "R07"
    to: "R08"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  # R08 <-> R01
  - from: "R08"
    to: "R01"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/2"

  # Inner Cross-Mesh Backbone (6 links)
  # R09 connects to R02, R06, R08
  - from: "R09"
    to: "R02"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/0"
    to_port: "GigabitEthernet0/2"

  - from: "R09"
    to: "R06"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/2"

  - from: "R09"
    to: "R08"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/2"
    to_port: "GigabitEthernet0/2"

  # R10 connects to R03, R05, R04
  - from: "R10"
    to: "R03"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/2"

  - from: "R10"
    to: "R05"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/2"
    to_port: "GigabitEthernet0/2"

  # Cross-Chord between R04 and R07
  - from: "R04"
    to: "R07"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/2"
    to_port: "GigabitEthernet0/2"

