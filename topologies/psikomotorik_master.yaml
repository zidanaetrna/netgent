name: "Tugas Psikomotorik 3 - Master Showcase Topologi (Bus, Star, Ring, Mesh, Hybrid)"
description: "Master topology canvas menampilkan kelima topologi psikomotorik (No 1 s/d 5) secara berdampingan dalam 5 zona terpisah, lengkap dengan label penanda nomor, konfigurasi IP, dan verifikasi konektivitas."

