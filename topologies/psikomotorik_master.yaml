connections:
  # =========================================================================
  # CONNECTIONS: NO 1 - TOPOLOGI BUS
  # =========================================================================
  # Backbone Bus Inter-Hub Links (Horizontal Chain)
  - from: "NO1-BUS-HUB-SEG1"
    to: "NO1-BUS-HUB-SEG2"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet1"
    to_port: "FastEthernet0"

  - from: "NO1-BUS-HUB-SEG2"
    to: "NO1-BUS-HUB-SEG3-KRITIS"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet2"
    to_port: "FastEthernet0"

  - from: "NO1-BUS-HUB-SEG3-KRITIS"
    to: "NO1-BUS-HUB-SEG4"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet2"
    to_port: "FastEthernet0"

  - from: "NO1-BUS-HUB-SEG4"
    to: "NO1-BUS-HUB-SEG5"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet2"
    to_port: "FastEthernet0"

  # Drop cables to PCs
  - from: "NO1-BUS-PC1"
    to: "NO1-BUS-HUB-SEG1"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0"

  - from: "NO1-BUS-PC2"
    to: "NO1-BUS-HUB-SEG2"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet1"

  - from: "NO1-BUS-PC3"
    to: "NO1-BUS-HUB-SEG3-KRITIS"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet1"

  - from: "NO1-BUS-PC4"
    to: "NO1-BUS-HUB-SEG4"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet1"

  - from: "NO1-BUS-PC5"
    to: "NO1-BUS-HUB-SEG5"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet1"

  # =========================================================================
  # CONNECTIONS: NO 2 - TOPOLOGI STAR
  # =========================================================================
  - from: "NO2-STAR-PC1"
    to: "NO2-STAR-SW-PUSAT"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/1"

  - from: "NO2-STAR-PC2"
    to: "NO2-STAR-SW-PUSAT"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/2"

  - from: "NO2-STAR-PC3"
    to: "NO2-STAR-SW-PUSAT"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/3"

  - from: "NO2-STAR-PC4"
    to: "NO2-STAR-SW-PUSAT"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/4"

  - from: "NO2-STAR-PC5"
    to: "NO2-STAR-SW-PUSAT"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/5"

  # =========================================================================
  # CONNECTIONS: NO 3 - TOPOLOGI RING
  # =========================================================================
  # Closed Loop Inter-Switch Ring Links
  - from: "NO3-RING-SW1"
    to: "NO3-RING-SW2"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet0/23"
    to_port: "FastEthernet0/23"

  - from: "NO3-RING-SW2"
    to: "NO3-RING-SW3"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet0/24"
    to_port: "FastEthernet0/23"

  - from: "NO3-RING-SW3"
    to: "NO3-RING-SW4"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet0/24"
    to_port: "FastEthernet0/23"

  - from: "NO3-RING-SW4"
    to: "NO3-RING-SW1"
    cable_type: "copper_cross_over"
    from_port: "FastEthernet0/24"
    to_port: "FastEthernet0/24"

  # Ring Node to PCs
  - from: "NO3-RING-PC1"
    to: "NO3-RING-SW1"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/1"

  - from: "NO3-RING-PC2"
    to: "NO3-RING-SW2"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/1"

  - from: "NO3-RING-PC3"
    to: "NO3-RING-SW3"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/1"

  - from: "NO3-RING-PC4"
    to: "NO3-RING-SW4"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0"
    to_port: "FastEthernet0/1"

  # =========================================================================
  # CONNECTIONS: NO 4 - TOPOLOGI MESH (6 Links)
  # =========================================================================
  # R1 connections
  - from: "NO4-MESH-R1-HQ"
    to: "NO4-MESH-R2-EAST"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/0"
    to_port: "GigabitEthernet0/0"

  - from: "NO4-MESH-R1-HQ"
    to: "NO4-MESH-R3-DC"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/0"

  - from: "NO4-MESH-R1-HQ"
    to: "NO4-MESH-R4-WEST"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/2"
    to_port: "GigabitEthernet0/0"

  # R2 connections
  - from: "NO4-MESH-R2-EAST"
    to: "NO4-MESH-R3-DC"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/1"

  - from: "NO4-MESH-R2-EAST"
    to: "NO4-MESH-R4-WEST"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/2"
    to_port: "GigabitEthernet0/1"

  # R3 to R4
  - from: "NO4-MESH-R3-DC"
    to: "NO4-MESH-R4-WEST"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/2"
    to_port: "GigabitEthernet0/2"

  # =========================================================================
  # CONNECTIONS: NO 5 - TOPOLOGI HYBRID ORGANISASI
  # =========================================================================
  # WAN Link between HQ Router and Branch Router
  - from: "NO5-HYB-R-HQ"
    to: "NO5-HYB-R-BRANCH"
    cable_type: "copper_cross_over"
    from_port: "GigabitEthernet0/2"
    to_port: "GigabitEthernet0/2"

  # HQ LAN Star Connections
  - from: "NO5-HYB-R-HQ"
    to: "NO5-HYB-SW-HQ"
    cable_type: "copper_straight_through"
    from_port: "GigabitEthernet0/0"
    to_port: "GigabitEthernet0/1"

  - from: "NO5-HYB-SW-HQ"
    to: "NO5-HYB-PC-DIR"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/1"
    to_port: "FastEthernet0"

  - from: "NO5-HYB-SW-HQ"
    to: "NO5-HYB-SRV-ERP"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/2"
    to_port: "FastEthernet0"

  # Branch LAN Star Connections
  - from: "NO5-HYB-R-BRANCH"
    to: "NO5-HYB-SW-BR"
    cable_type: "copper_straight_through"
    from_port: "GigabitEthernet0/0"
    to_port: "GigabitEthernet0/1"

  - from: "NO5-HYB-SW-BR"
    to: "NO5-HYB-PC-STF1"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/1"
    to_port: "FastEthernet0"

  - from: "NO5-HYB-SW-BR"
    to: "NO5-HYB-PC-STF2"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/2"
    to_port: "FastEthernet0"

configurations:
  # =========================================================================
  # CONFIGURATIONS: NO 1 - TOPOLOGI BUS (Subnet 192.168.10.0/24)
  # =========================================================================
  NO1-BUS-PC1:
    type: "pc"
    ip_address: "192.168.10.11"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.10.1"

  NO1-BUS-PC2:
    type: "pc"
    ip_address: "192.168.10.12"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.10.1"

  NO1-BUS-PC3:
    type: "pc"
    ip_address: "192.168.10.13"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.10.1"

  NO1-BUS-PC4:
    type: "pc"
    ip_address: "192.168.10.14"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.10.1"

  NO1-BUS-PC5:
    type: "pc"
    ip_address: "192.168.10.15"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.10.1"

  # =========================================================================
  # CONFIGURATIONS: NO 2 - TOPOLOGI STAR (Subnet 192.168.20.0/24)
  # =========================================================================
  NO2-STAR-SW-PUSAT:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname NO2-STAR-SW-PUSAT"
      - "end"
      - "write memory"

  NO2-STAR-PC1:
    type: "pc"
    ip_address: "192.168.20.11"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.20.1"

  NO2-STAR-PC2:
    type: "pc"
    ip_address: "192.168.20.12"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.20.1"

  NO2-STAR-PC3:
    type: "pc"
    ip_address: "192.168.20.13"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.20.1"

  NO2-STAR-PC4:
    type: "pc"
    ip_address: "192.168.20.14"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.20.1"

  NO2-STAR-PC5:
    type: "pc"
    ip_address: "192.168.20.15"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.20.1"

  # =========================================================================
  # CONFIGURATIONS: NO 3 - TOPOLOGI RING (Subnet 192.168.30.0/24)
  # =========================================================================
  NO3-RING-SW1:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname NO3-RING-SW1"
      - "end"

  NO3-RING-SW2:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname NO3-RING-SW2"
      - "end"

  NO3-RING-SW3:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname NO3-RING-SW3"
      - "end"

  NO3-RING-SW4:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname NO3-RING-SW4"
      - "end"

  NO3-RING-PC1:
    type: "pc"
    ip_address: "192.168.30.11"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.30.1"

  NO3-RING-PC2:
    type: "pc"
    ip_address: "192.168.30.12"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.30.1"

  NO3-RING-PC3:
    type: "pc"
    ip_address: "192.168.30.13"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.30.1"

  NO3-RING-PC4:
    type: "pc"
    ip_address: "192.168.30.14"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.30.1"

  # =========================================================================
  # CONFIGURATIONS: NO 4 - TOPOLOGI MESH 4 ROUTER (Point-to-Point /30 + OSPF)
  # =========================================================================
  NO4-MESH-R1-HQ:
    type: "ios"
    commands:
      - "no"
      - "enable"
      - "configure terminal"
      - "hostname NO4-MESH-R1-HQ"
      - "interface GigabitEthernet0/0"
      - "ip address 10.4.12.1 255.255.255.252"
      - "no shutdown"
      - "exit"
      - "interface GigabitEthernet0/1"
      - "ip address 10.4.13.1 255.255.255.252"
      - "no shutdown"
      - "exit"
      - "interface GigabitEthernet0/2"
      - "ip address 10.4.14.1 255.255.255.252"
      - "no shutdown"
      - "exit"
      - "router ospf 1"
      - "network 10.4.0.0 0.0.255.255 area 0"
      - "end"
      - "write memory"

  NO4-MESH-R2-EAST:
