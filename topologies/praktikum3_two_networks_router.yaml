name: "Praktikum 3 - Menghubungkan Dua Network Menggunakan Router"
description: "Interkoneksi dua subnet berbeda (192.168.1.0/24 dan 192.168.2.0/24) menggunakan Router Cisco 2911 dengan dua Switch 2960 dan 4 PC."

devices:
  - id: "R1"
    type: "router_2911"
    position:
      x: 0.50
      y: 0.18

  # Network 1 (Sisi Kiri)
  - id: "SW1"
    type: "switch_2960"
    position:
      x: 0.30
      y: 0.45

  - id: "PC1"
    type: "pc"
    position:
      x: 0.20
      y: 0.75

  - id: "PC2"
    type: "pc"
    position:
      x: 0.35
      y: 0.75

  # Network 2 (Sisi Kanan)
  - id: "SW2"
    type: "switch_2960"
    position:
      x: 0.70
      y: 0.45

  - id: "PC3"
    type: "pc"
    position:
      x: 0.65
      y: 0.75

  - id: "PC4"
    type: "pc"
    position:
      x: 0.80
      y: 0.75

connections:
  # Router -> Switch 1 (Network 1)
  - from: "R1"
    to: "SW1"
    cable_type: "copper_straight_through"
    from_port: "GigabitEthernet0/0"
    to_port: "GigabitEthernet0/1"

  # Switch 1 -> PC1 & PC2
  - from: "SW1"
    to: "PC1"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/1"
    to_port: "FastEthernet0"

  - from: "SW1"
    to: "PC2"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/2"
    to_port: "FastEthernet0"

  # Router -> Switch 2 (Network 2)
  - from: "R1"
    to: "SW2"
    cable_type: "copper_straight_through"
    from_port: "GigabitEthernet0/1"
    to_port: "GigabitEthernet0/1"

  # Switch 2 -> PC3 & PC4
  - from: "SW2"
    to: "PC3"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/1"
    to_port: "FastEthernet0"

  - from: "SW2"
    to: "PC4"
    cable_type: "copper_straight_through"
    from_port: "FastEthernet0/2"
    to_port: "FastEthernet0"

configurations:
  R1:
    type: "ios"
    commands:
      - "no"
      - "enable"
      - "configure terminal"
      - "hostname Router-Core"
      - "interface GigabitEthernet0/0"
      - "ip address 192.168.1.1 255.255.255.0"
      - "no shutdown"
      - "exit"
      - "interface GigabitEthernet0/1"
      - "ip address 192.168.2.1 255.255.255.0"
      - "no shutdown"
      - "end"
      - "write memory"

  SW1:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname Switch-Net1"
      - "end"

  SW2:
    type: "ios"
    commands:
      - "enable"
      - "configure terminal"
      - "hostname Switch-Net2"
      - "end"

  # Network 1 PCs (Gateway: 192.168.1.1)
  PC1:
    type: "pc"
    ip_address: "192.168.1.10"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.1.1"

  PC2:
    type: "pc"
    ip_address: "192.168.1.11"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.1.1"

  # Network 2 PCs (Gateway: 192.168.2.1)
  PC3:
    type: "pc"
    ip_address: "192.168.2.10"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.2.1"

  PC4:
    type: "pc"
    ip_address: "192.168.2.11"
    subnet_mask: "255.255.255.0"
    default_gateway: "192.168.2.1"

verifications:
  # Intra-Network 1 Ping
  - source: "PC1"
    target_ip: "192.168.1.11"
    ping_count: 4

  # Inter-Network Ping (PC1 Net 1 -> PC3 Net 2)
  - source: "PC1"
    target_ip: "192.168.2.10"
    ping_count: 4

  # Inter-Network Ping (PC4 Net 2 -> PC2 Net 1)
  - source: "PC4"
    target_ip: "192.168.1.11"
    ping_count: 4
